name: Refresh Meta product feed

on:
  schedule:
    # Mondays 03:00 UTC = 07:00 UAE
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet Pillow 'qrcode[pil]'

      - name: Regenerate feed + new cards
        run: python generate_feed.py

      - name: Commit + push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed.xml cards/
          if git diff --cached --quiet; then
            echo "No changes from sheet — feed already current"
            exit 0
          fi
          NEW=$(git diff --cached --name-only --diff-filter=A | wc -l)
          MOD=$(git diff --cached --name-only --diff-filter=M | wc -l)
          DEL=$(git diff --cached --name-only --diff-filter=D | wc -l)
          git commit -m "Weekly feed refresh: +${NEW} new, ${MOD} updated, ${DEL} removed"
          git push
