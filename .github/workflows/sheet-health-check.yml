name: Sheet Health Check

on:
  schedule:
    # Every 90 minutes (two cron lines that interleave)
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch: # manual trigger

permissions:
  contents: read
  issues: write

jobs:
  check-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Google Sheet CSV
        id: fetch
        run: |
          SHEET_ID="1CfIRlk55aGLI2nLBuUFH4pvRu5gT6qSo3aIzh2iDeAo"
          GID="0"
          URL_1="https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&gid=${GID}"
          URL_2="https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}"
          URL_3="https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1"

          HTTP_CODE=$(curl -sL -o /tmp/sheet.csv -w "%{http_code}" "$URL_1")
          if [ "$HTTP_CODE" != "200" ] || [ ! -s /tmp/sheet.csv ]; then
            HTTP_CODE=$(curl -sL -o /tmp/sheet.csv -w "%{http_code}" "$URL_2")
          fi
          if [ "$HTTP_CODE" != "200" ] || [ ! -s /tmp/sheet.csv ]; then
            HTTP_CODE=$(curl -sL -o /tmp/sheet.csv -w "%{http_code}" "$URL_3")
          fi

          TOTAL_ROWS=$(wc -l < /tmp/sheet.csv)
          AVAILABLE=$(grep -c "Available" /tmp/sheet.csv || true)

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "total_rows=$TOTAL_ROWS" >> "$GITHUB_OUTPUT"
          echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"

          echo "HTTP: $HTTP_CODE | Total rows: $TOTAL_ROWS | Available: $AVAILABLE"

          # Determine health
          if [ "$HTTP_CODE" != "200" ]; then
            echo "status=HTTP_ERROR" >> "$GITHUB_OUTPUT"
            echo "message=Google Sheets returned HTTP $HTTP_CODE" >> "$GITHUB_OUTPUT"
          elif [ "$TOTAL_ROWS" -lt 100 ]; then
            echo "status=EMPTY" >> "$GITHUB_OUTPUT"
            echo "message=Sheet returned only $TOTAL_ROWS rows (expected 2500+). CSV may be truncated or sheet is empty." >> "$GITHUB_OUTPUT"
          elif [ "$AVAILABLE" -lt 2500 ]; then
            echo "status=LOW_COUNT" >> "$GITHUB_OUTPUT"
            echo "message=Only $AVAILABLE available numbers found (expected 2500+). $TOTAL_ROWS total rows fetched." >> "$GITHUB_OUTPUT"
          else
            echo "status=OK" >> "$GITHUB_OUTPUT"
            echo "message=All good. $AVAILABLE available numbers from $TOTAL_ROWS rows." >> "$GITHUB_OUTPUT"
          fi

      - name: Open GitHub Issue on failure
        if: steps.fetch.outputs.status != 'OK'
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ steps.fetch.outputs.status }}';
            const message = `${{ steps.fetch.outputs.message }}`;
            const httpCode = '${{ steps.fetch.outputs.http_code }}';
            const totalRows = '${{ steps.fetch.outputs.total_rows }}';
            const available = '${{ steps.fetch.outputs.available }}';

            // Check for existing open issue to avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sheet-health'
            });

            if (existing.data.length > 0) {
              // Add comment to existing issue instead of opening a new one
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `**Still failing** (${new Date().toISOString()})\n\n- Status: \`${status}\`\n- HTTP: ${httpCode}\n- Total rows: ${totalRows}\n- Available: ${available}\n- Detail: ${message}`
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sheet Sync Alert: ${status}`,
              labels: ['sheet-health'],
              body: `## Google Sheet Health Check Failed\n\n| Metric | Value |\n|--------|-------|\n| Status | \`${status}\` |\n| HTTP Code | ${httpCode} |\n| Total Rows | ${totalRows} |\n| Available Numbers | ${available} |\n| Expected | 2500+ |\n\n**Detail:** ${message}\n\n**Sheet:** [Open in Google Sheets](https://docs.google.com/spreadsheets/d/1CfIRlk55aGLI2nLBuUFH4pvRu5gT6qSo3aIzh2iDeAo/edit)\n\n**Page:** [choose-number](https://etisalat.shop/choose-number/)\n\n---\n_Auto-generated by Sheet Health Check workflow. Close this issue once resolved._`
            });

      - name: Email alert via FormSubmit
        if: steps.fetch.outputs.status != 'OK'
        run: |
          curl -s https://formsubmit.co/ajax/mallikamiin@gmail.com \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{
              "_subject": "etisalat.shop Sheet Alert: ${{ steps.fetch.outputs.status }}",
              "Status": "${{ steps.fetch.outputs.status }}",
              "HTTP Code": "${{ steps.fetch.outputs.http_code }}",
              "Total Rows": "${{ steps.fetch.outputs.total_rows }}",
              "Available Numbers": "${{ steps.fetch.outputs.available }}",
              "Detail": "${{ steps.fetch.outputs.message }}",
              "Sheet Link": "https://docs.google.com/spreadsheets/d/1CfIRlk55aGLI2nLBuUFH4pvRu5gT6qSo3aIzh2iDeAo/edit",
              "Page": "https://etisalat.shop/choose-number/"
            }'

      - name: Auto-close issue on recovery
        if: steps.fetch.outputs.status == 'OK'
        uses: actions/github-script@v8
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sheet-health'
            });

            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `**Resolved** (${new Date().toISOString()})\n\nSheet is healthy again: ${{ steps.fetch.outputs.available }} available numbers.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
